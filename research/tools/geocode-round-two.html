<!doctype html><html lang="en"><meta charset="utf-8"><title>Nashua address audit</title><body><h1>Address coordinate research</h1><p>Review public address matches before importing. OpenStreetMap Nominatim attribution applies.</p><button id="run">Look up researched addresses</button><a id="download" hidden>Download geocodes</a><pre id="result">Ready</pre><script type="module">
const output=document.querySelector('#result');
document.querySelector('#run').onclick=async()=>{const data=await(await fetch('./data/round-two.json')).json();const results=[];const addresses=[...new Set(data.map(r=>r.address.split(',')[0]))];document.querySelector('#run').disabled=true;for(const address of addresses){try{const p=new URLSearchParams({format:'jsonv2',street:address,city:'Nashua',state:'New Hampshire',country:'United States',limit:'20',addressdetails:'1'});const response=await fetch('https://nominatim.openstreetmap.org/search?'+p);if(!response.ok)throw Error(response.status);results.push({address,matches:await response.json()})}catch(e){results.push({address,error:String(e)})}output.textContent=JSON.stringify(results,null,2);await new Promise(r=>setTimeout(r,1200))}const a=document.querySelector('#download');a.download='nashua-round-two-refined.json';a.href=URL.createObjectURL(new Blob([JSON.stringify(results,null,2)],{type:'application/json'}));a.hidden=false};
</script></body></html>
