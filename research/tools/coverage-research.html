<!doctype html><html lang="en"><meta charset="utf-8"><title>Nashua coverage research</title><body><h1>Nashua city-boundary coverage audit</h1><p>Fetch public OpenStreetMap restaurant, cafe, fast food, ice cream, pub, bar, bakery, coffee and deli records within Nashua. Review before importing.</p><button id="fetch">Fetch city records</button><a id="download" hidden>Download raw audit</a><pre id="result">Ready</pre><script type="module">
const query='[out:json][timeout:45];rel["name"="Nashua"]["boundary"="administrative"](42.69,-71.60,42.85,-71.40);map_to_area->.city;(nwr["amenity"~"^(restaurant|cafe|fast_food|ice_cream|food_court|pub|bar|biergarten)$"](area.city);nwr["shop"~"^(bakery|coffee|deli|pastry|confectionery)$"](area.city););out center tags;';
document.querySelector('#fetch').onclick=async()=>{const el=document.querySelector('#result');el.textContent='Loading city boundary query…';try{const r=await fetch('https://overpass.kumi.systems/api/interpreter?data='+encodeURIComponent(query));if(!r.ok)throw Error(r.status);const data=await r.json();data.auditQuery=query;data.retrievedAt=new Date().toISOString();el.textContent=JSON.stringify(data,null,2);const a=document.querySelector('#download');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='nashua-expanded-osm.json';a.hidden=false}catch(e){el.textContent=String(e)}};
</script></body></html>
